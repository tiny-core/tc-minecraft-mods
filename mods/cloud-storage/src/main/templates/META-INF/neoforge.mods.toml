modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Jocian Mendonca (tiny-core)"
description='''
Armazenamento de itens na nuvem do TCMine, visivel para a rede ME do Applied Energistics 2:
o jogador reencontra os itens em outro servidor do mesmo dono.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tccore"
    type="required"
    versionRange="${tccore_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="[${ae2_version},20)"
    ordering="AFTER"
    side="BOTH"
