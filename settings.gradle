pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Baixa sozinho o JDK 21 que os mods exigem (Windows ou Linux).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'tc_minecraft_mods'

// Cada mod é um subprojeto que mora em mods/<nome>. O nome do projeto continua curto (':core',
// ':colony-bridge'), então os comandos não mudam: ./gradlew :colony-bridge:runClient.
// Para criar um mod novo: pasta mods/<nome> com build.gradle + gradle.properties (ver README.md)
// e o nome dele na lista abaixo.
['core', 'colony-bridge'].each { name ->
    include name
    project(":$name").projectDir = file("mods/$name")
}
