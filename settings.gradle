pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Baixa sozinho o JDK 21 que os mods exigem (Windows ou Linux).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'tc_minecraft_mods'

// Cada mod é um subprojeto. Para criar um mod novo: nova pasta com build.gradle + gradle.properties
// (ver README.md) e uma linha aqui.
include 'core'
include 'colony-bridge'
