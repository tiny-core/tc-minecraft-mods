plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral() // AE2 API
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Testes: classes do Minecraft/NeoForge no classpath (NBT, enums, codecs), sem subir o jogo inteiro.
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    // AE2: compila contra a API publicada
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"

    // MineColonies (+ Structurize, BlockUI, Domum Ornamentum) e o AE2 completo:
    // copiados do seu ATM10 para ./libs, assim você compila e testa contra
    // exatamente as mesmas versões que o modpack usa.
    compileOnly fileTree(dir: 'libs', include: 'minecolonies-*.jar')
    // JEI: opcional em jogo; só usado para arrastar itens para o filtro (client/jei/).
    compileOnly fileTree(dir: 'libs', include: 'jei-*.jar')
    localRuntime fileTree(dir: 'libs', include: '*.jar')

    // Testes automáticos (JUnit 5) das partes que não precisam do jogo carregado: ./gradlew test
    testImplementation "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Mostra cada teste no terminal e, se falhar, o motivo completo.
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            ae2_version            : ae2_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
