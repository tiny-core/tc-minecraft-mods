// Configuração comum de um mod TC (aplicada com "apply from" no build.gradle de cada mod).
// Lê do gradle.properties do mod: mod_id, mod_name, mod_version, mod_group_id; e da raiz: versões.

apply plugin: 'net.neoforged.moddev'
apply plugin: 'idea'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Testes: classes do Minecraft/NeoForge no classpath (NBT, enums, codecs), sem subir o jogo inteiro.
neoForge.addModdingDependenciesTo(sourceSets.test)

// neoforge.mods.toml gerado a partir de src/main/templates, trocando ${...} pelas propriedades abaixo
// (as que o mod não define são ignoradas).
var templateKeys = ['minecraft_version', 'minecraft_version_range', 'neo_version', 'loader_version_range',
                    'mod_id', 'mod_name', 'mod_license', 'mod_version',
                    'ae2_version', 'tccore_version_range']
var replaceProperties = templateKeys.findAll { project.hasProperty(it) }
        .collectEntries { [(it): project.property(it).toString()] }
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
